<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre-se para participar como voluntário da ONG Solidária.">
    <title>ONG Solidária | Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="cabecalho">
        <div class="container">
            <a class="logo" href="index.html">
            <img src="img/logo-ong.png" alt="Logo da ONG Solidária">
            </a>

            <nav aria-label="Navegação principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="projetos.html">Projetos</a></li>
                    <li><a href="cadastro.html" aria-current="page">Seja voluntário</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="pagina-titulo">
            <div class="container">
                <p class="destaque">Engajamento</p>
                <h1>Faça parte da nossa rede</h1>
                <p>
                    Preencha seus dados para demonstrar interesse em participar
                    das nossas iniciativas.
                </p>
            </div>
        </section>

        <section class="secao">
            <div class="container formulario-container">

                <form id="formularioCadastro" novalidate>

                    <fieldset>
                        <legend>Dados pessoais</legend>

                        <div class="campo">
                            <label for="nome">Nome completo *</label>
                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                autocomplete="name"
                                minlength="3"
                                maxlength="100"
                                required
                                placeholder="Digite seu nome completo"
                            >
                            <small>Informe seu nome completo.</small>
                        </div>

                        <div class="linha">
                            <div class="campo">
                                <label for="cpf">CPF *</label>
                                <input
                                    type="text"
                                    id="cpf"
                                    name="cpf"
                                    inputmode="numeric"
                                    autocomplete="off"
                                    maxlength="14"
                                    placeholder="000.000.000-00"
                                    required
                                    aria-describedby="erroCpf"
                                >
                                <small id="erroCpf" class="mensagem-erro"></small>
                            </div>

                            <div class="campo">
                                <label for="dataNascimento">Data de nascimento *</label>
                                <input
                                    type="date"
                                    id="dataNascimento"
                                    name="dataNascimento"
                                    autocomplete="bday"
                                    required
                                >
                            </div>
                        </div>

                        <div class="linha">
                            <div class="campo">
                                <label for="email">E-mail *</label>
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    autocomplete="email"
                                    maxlength="120"
                                    required
                                    placeholder="seu@email.com"
                                >
                            </div>

                            <div class="campo">
                                <label for="telefone">Telefone *</label>
                                <input
                                    type="tel"
                                    id="telefone"
                                    name="telefone"
                                    inputmode="numeric"
                                    autocomplete="tel"
                                    maxlength="15"
                                    placeholder="(00) 00000-0000"
                                    required
                                    aria-describedby="erroTelefone"
                                >
                                <small id="erroTelefone" class="mensagem-erro"></small>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Endereço</legend>

                        <div class="linha">
                            <div class="campo campo-cep">
                                <label for="cep">CEP *</label>
                                <input
                                    type="text"
                                    id="cep"
                                    name="cep"
                                    inputmode="numeric"
                                    autocomplete="postal-code"
                                    maxlength="9"
                                    placeholder="00000-000"
                                    required
                                    aria-describedby="erroCep"
                                >
                                <small id="erroCep" class="mensagem-erro"></small>
                            </div>

                            <div class="campo">
                                <label for="cidade">Cidade *</label>
                                <input
                                    type="text"
                                    id="cidade"
                                    name="cidade"
                                    autocomplete="address-level2"
                                    maxlength="80"
                                    required
                                >
                            </div>
                        </div>

                        <div class="campo">
                            <label for="endereco">Endereço *</label>
                            <input
                                type="text"
                                id="endereco"
                                name="endereco"
                                maxlength="150"
                                required
                                placeholder="Rua, avenida, número..."
                            >
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Interesse voluntário</legend>

                        <div class="campo">
                            <label for="area">Área de interesse *</label>
                            <select id="area" name="area" required>
                                <option value="">Selecione uma opção</option>
                                <option value="educacao">Educação</option>
                                <option value="arrecadacao">Arrecadação</option>
                                <option value="eventos">Eventos</option>
                                <option value="comunicacao">Comunicação</option>
                                <option value="administrativo">Administrativo</option>
                                <option value="outros">Outros</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="mensagem">Conte um pouco sobre você</label>
                            <textarea
                                id="mensagem"
                                name="mensagem"
                                rows="5"
                                maxlength="500"
                                placeholder="Como você gostaria de contribuir?"
                            ></textarea>
                        </div>

                        <div class="campo checkbox">
                            <input
                                type="checkbox"
                                id="termos"
                                name="termos"
                                required
                            >
                            <label for="termos">
                                Declaro que as informações fornecidas são verdadeiras
                                e concordo com o contato da ONG. *
                            </label>
                        </div>
                    </fieldset>

                    <div
                        id="mensagemFormulario"
                        class="mensagem-formulario"
                        role="alert"
                        aria-live="polite"
                    ></div>

                    <button type="submit" class="botao">
                        Enviar cadastro
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <div class="container">
            <p>&copy; 2026 ONG Solidária. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="js/formulario.js"></script>
</body>
</html>
